<style>
:root{color-scheme:dark;--night:#070b1f;--navy:#0a1030;--navy2:#101a4a;--gold:#f6bd62;--ember:#ef8a5c;--mist:#f1f4ff;--muted:#b8c3e6;--faint:#8794bd;--line:rgba(246,189,98,.28);--card:#0e1642;--f-display:"Playfair Display",Georgia,serif;--f-body:"Plus Jakarta Sans","Segoe UI",system-ui,sans-serif;--gut:max(18px,env(safe-area-inset-left,0px))}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--navy);color:var(--mist);font-family:var(--f-body);font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit}:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:6px}
.wrap{width:100%;max-width:1160px;margin:0 auto;padding-inline:var(--gut)}
.sr{position:absolute;left:-9999px}.sr:focus{left:12px;top:12px;z-index:99;background:#fff;color:#000;padding:8px 12px;border-radius:8px}

/* tombol & bilah atas */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;font:700 .78rem/1 var(--f-body);letter-spacing:.14em;text-transform:uppercase;border-radius:999px;padding:14px 24px;min-height:46px;cursor:pointer;text-decoration:none;border:1px solid transparent;transition:transform .25s,background .25s,color .25s,box-shadow .25s;white-space:nowrap}
.btn svg{width:16px;height:16px;flex:none}
.btn-gold{background:linear-gradient(135deg,#fbd38a,#ee9f4d);color:#1a1030;box-shadow:0 10px 28px -10px rgba(246,160,70,.7)}.btn-gold:hover{transform:translateY(-2px)}
.btn-line{background:rgba(255,255,255,.05);color:var(--mist);border-color:rgba(241,244,255,.45)}.btn-line:hover{background:var(--gold);color:#1a1030;border-color:var(--gold)}
.btn-sm{padding:10px 18px;font-size:.72rem;min-height:40px}
.nav{position:fixed;inset:0 0 auto 0;z-index:50;transition:background .3s,border-color .3s;border-bottom:1px solid transparent}
.nav.solid{background:rgba(7,11,31,.92);border-bottom-color:rgba(246,189,98,.14)}
.nav .wrap{display:flex;align-items:center;gap:26px;padding-block:14px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;margin-right:auto;min-width:0}.brand img{width:38px;height:38px;object-fit:contain;border-radius:10px}
.bt{display:flex;flex-direction:column;line-height:1.05;min-width:0}.bt b{font-weight:800;font-size:1.02rem;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap}.bt small{font-size:.6rem;letter-spacing:.26em;text-transform:uppercase;color:var(--muted);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.links{display:flex;gap:26px;list-style:none;margin:0;padding:0}.links a{font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;text-decoration:none;color:var(--muted);padding-block:6px;border-bottom:1px solid transparent;transition:color .25s,border-color .25s}.links a:hover,.links a.on{color:var(--mist);border-bottom-color:var(--gold)}

/* ===== PERJALANAN: gerbang terbuka saat digulir ===== */
.journey{position:relative;height:250vh}
.stage{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden;background:linear-gradient(180deg,#050823 0%,#0f1b5e 38%,#3b3f98 58%,#c26a8c 74%,#f4a574 86%,#ffd49a 100%)}
.stars{position:absolute;inset:0 0 40% 0;background-image:radial-gradient(1.4px 1.4px at 12% 18%,#fff8e8,transparent),radial-gradient(1px 1px at 28% 34%,#fff,transparent),radial-gradient(1.6px 1.6px at 44% 12%,#fff8e8,transparent),radial-gradient(1px 1px at 61% 28%,#fff,transparent),radial-gradient(1.4px 1.4px at 77% 16%,#fff8e8,transparent),radial-gradient(1px 1px at 90% 36%,#fff,transparent),radial-gradient(1px 1px at 6% 44%,#fff,transparent),radial-gradient(1.2px 1.2px at 52% 42%,#fff,transparent),radial-gradient(1px 1px at 84% 8%,#fff,transparent);opacity:.85;animation:tw 5s ease-in-out infinite alternate}
@keyframes tw{from{opacity:.55}to{opacity:.95}}
#world{position:absolute;inset:0;width:100%;height:100%;display:block;will-change:transform}
.flash{position:absolute;inset:0;opacity:0;pointer-events:none;background:radial-gradient(circle at 50% 66%,#fff6dc 0%,#ffd08a 22%,#f0a060 48%,#7a4a7a 100%)}
.veil{position:absolute;inset:0;opacity:0;pointer-events:none;background:var(--navy)}
.hero-txt{position:absolute;left:0;right:0;top:max(12vh,86px);text-align:center;padding-inline:var(--gut);will-change:transform,opacity}
.eyebrow{display:inline-flex;align-items:center;gap:12px;font-size:.7rem;letter-spacing:.32em;text-transform:uppercase;color:var(--gold);font-weight:700}
.eyebrow::before,.eyebrow::after{content:"";width:28px;height:1px;background:currentColor;opacity:.7}
.hero-title{font-family:var(--f-display);font-weight:800;line-height:.95;letter-spacing:.02em;margin:16px 0 14px;color:#fff8ee;text-shadow:0 6px 36px rgba(8,6,36,.6);white-space:nowrap;text-transform:uppercase}
.hero-title span{display:inline-block;animation:letter 1.1s cubic-bezier(.2,.8,.2,1) both}
@keyframes letter{from{opacity:0;transform:translateY(.3em)}to{opacity:1;transform:none}}
.hero-title em{display:block;font-style:italic;font-weight:500;text-transform:none;font-size:max(.3em,14px);letter-spacing:.01em;color:var(--gold);margin-bottom:.2em;white-space:normal;line-height:1.15}
.hero-lead{max-width:560px;margin:0 auto 22px;color:#e4eaff;font-size:clamp(.95rem,1.2vw,1.08rem);text-shadow:0 2px 14px rgba(5,8,35,.9)}
.cta{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.foot-hero{position:absolute;left:0;right:0;bottom:max(18px,env(safe-area-inset-bottom,0px));text-align:center;padding-inline:var(--gut)}
.pillars{display:flex;flex-wrap:wrap;gap:6px 18px;justify-content:center;font-size:.66rem;letter-spacing:.2em;text-transform:uppercase;color:#f2ecff;text-shadow:0 1px 8px rgba(5,8,35,.9)}
.pillars span{display:flex;align-items:center;gap:8px}.pillars span+span::before{content:"";width:4px;height:4px;border-radius:50%;background:var(--gold)}
.pillars-label{width:100%;color:var(--gold);font-size:.6rem;letter-spacing:.3em}
.cue{margin-top:12px;font-size:.62rem;letter-spacing:.3em;text-transform:uppercase;color:rgba(255,255,255,.75)}
.cue i{display:block;width:1px;height:34px;margin:8px auto 0;background:linear-gradient(var(--gold),transparent);animation:cue 1.8s ease-in-out infinite}
@keyframes cue{0%{transform:scaleY(0);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}51%{transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}

/* animasi bagian gambar */
.flick{animation:flick 3.2s steps(1) infinite}.flick.b{animation-duration:5.4s}
@keyframes flick{0%,100%{opacity:.95}47%{opacity:.25}52%{opacity:.95}78%{opacity:.4}}
.flag{transform-box:fill-box;transform-origin:left center;animation:flag 2.4s ease-in-out infinite}
@keyframes flag{0%,100%{transform:skewY(-4deg) scaleX(1)}50%{transform:skewY(5deg) scaleX(.9)}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:.95;transform:scale(1.08)}}
.drift{animation:drift 26s ease-in-out infinite alternate}.drift.b{animation-duration:34s;animation-direction:alternate-reverse}
@keyframes drift{from{transform:translateX(-50px)}to{transform:translateX(60px)}}
.legL,.legR,.armL,.armR,.salute,.bob,.palm,.sweep,.sweepR{transform-box:fill-box}
.legL,.legR,.armL,.armR{transform-origin:50% 0}
.legL{animation:swing .9s ease-in-out infinite alternate}.legR{animation:swing .9s ease-in-out infinite alternate-reverse}
.armL{animation:swing2 .9s ease-in-out infinite alternate-reverse}.armR{animation:swing2 .9s ease-in-out infinite alternate}
@keyframes swing{from{transform:rotate(-22deg)}to{transform:rotate(22deg)}}@keyframes swing2{from{transform:rotate(-14deg)}to{transform:rotate(14deg)}}
.salute{transform-origin:20% 90%;animation:salute 3.8s ease-in-out infinite}@keyframes salute{0%,100%{transform:rotate(0)}50%{transform:rotate(-4deg)}}
.bob{transform-origin:50% 100%;animation:bob 3s ease-in-out infinite}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.6px)}}
.palm{transform-origin:50% 92%;animation:palmsway 6s ease-in-out infinite alternate}@keyframes palmsway{from{transform:rotate(-2.6deg)}to{transform:rotate(2.6deg)}}
.sweep{transform-origin:0% 50%;animation:sweep 9s ease-in-out infinite alternate}.sweepR{transform-origin:100% 50%;animation:sweepR 10s ease-in-out infinite alternate}
@keyframes sweep{from{transform:rotate(-26deg)}to{transform:rotate(12deg)}}@keyframes sweepR{from{transform:rotate(26deg)}to{transform:rotate(-12deg)}}
.walkx{animation:walkx var(--dur,30s) linear infinite}
@keyframes walkx{0%{transform:translateX(0);opacity:0}5%{opacity:1}95%{opacity:1}100%{transform:translateX(var(--dx));opacity:0}}
.paused *{animation-play-state:paused!important}
/* ponsel/perangkat ringan: tanpa animasi berkelanjutan di gambar */
.lite .stars,.lite .flick,.lite .flag,.lite .pulse,.lite .drift,.lite .legL,.lite .legR,.lite .armL,.lite .armR,.lite .salute,.lite .bob,.lite .palm,.lite .sweep,.lite .sweepR,.lite .walkx,.lite .cue i{animation:none}
.lite .walkx{opacity:0}.lite .sweep{transform:rotate(-6deg)}.lite .sweepR{transform:rotate(6deg)}

/* ===== BAGIAN ISI ===== */
section.blok{position:relative;padding:clamp(64px,10vw,120px) 0;content-visibility:auto;contain-intrinsic-size:auto 700px}
.kicker{font-size:.7rem;letter-spacing:.3em;text-transform:uppercase;color:var(--gold);font-weight:700;display:flex;align-items:center;gap:12px}
.kicker::before{content:"";width:34px;height:1px;background:currentColor;opacity:.7}
.big{font-family:var(--f-display);font-weight:500;font-size:clamp(2.6rem,7vw,5.6rem);line-height:.98;margin:.2em 0 .3em;color:#fff8ee;text-wrap:balance}.big i{color:var(--gold)}
.lead{font-size:1.05rem;color:#d5ddf7;max-width:60ch;margin:0}
.more{display:inline-flex;align-items:center;gap:12px;margin-top:20px;font-size:.76rem;letter-spacing:.2em;text-transform:uppercase;text-decoration:none;background:none;border:0;padding:6px 0;cursor:pointer;color:var(--mist);font-family:inherit}
.more::before{content:"";width:26px;height:1px;background:var(--gold);transition:width .35s}.more:hover::before{width:48px}

#informasi{background:radial-gradient(70% 38% at 50% 0,rgba(255,196,120,.2),transparent 70%),linear-gradient(var(--navy),#0b1238)}
.lorong{display:block;width:min(560px,86%);height:auto;margin:0 auto 26px;opacity:.9}
.info-head{max-width:680px;margin-bottom:40px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.feat{position:relative;background:linear-gradient(160deg,#111b52,#0c1340);border:1px solid rgba(241,244,255,.1);border-radius:18px;padding:26px 24px 24px;display:grid;gap:8px;overflow:hidden;transition:transform .3s,border-color .3s}
.feat:hover{transform:translateY(-3px);border-color:var(--line)}
.feat::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(var(--gold),transparent)}
.no{font:700 .68rem/1 var(--f-body);letter-spacing:.26em;color:var(--gold);text-transform:uppercase}
.feat h3{margin:0;font-size:1.08rem}.feat p{margin:0;color:var(--muted);font-size:.95rem}
.ico{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;background:rgba(246,189,98,.12);border:1px solid var(--line);color:var(--gold);margin-bottom:6px}.ico svg{width:22px;height:22px}
.roles{margin-top:56px;border:1px solid rgba(241,244,255,.1);border-radius:22px;padding:clamp(22px,4vw,36px);background:linear-gradient(120deg,#12205f,#0c1442)}
.roles-top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:10px 24px;margin-bottom:20px}
.roles-top h3{margin:0;font-family:var(--f-display);font-weight:600;font-size:1.7rem}.roles-top p{margin:0;color:var(--muted);font-size:.92rem;max-width:44ch}
.role-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.role{padding:18px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid rgba(241,244,255,.08)}
.role b{display:block;font-size:.82rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-bottom:6px}.role span{color:#d5ddf7;font-size:.93rem}

#pengumuman{background:linear-gradient(#0b1238 0%,#1a1f66 55%,#6a4a8c 82%,#e0907a 100%);padding-bottom:0;overflow:hidden}
.ann-top{margin-bottom:26px}.note{font-size:.88rem;color:var(--muted);margin:0;max-width:60ch}
.ann-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.card{display:flex;flex-direction:column;gap:12px;background:rgba(8,13,40,.9);border:1px solid rgba(241,244,255,.12);border-radius:18px;padding:24px;min-width:0;transition:transform .3s,border-color .3s}
.card:hover{transform:translateY(-3px);border-color:var(--line)}
.card.featured{grid-column:1/-1;padding:30px;border-color:var(--line);background:linear-gradient(120deg,rgba(246,189,98,.16),rgba(8,13,40,.92) 60%)}
.card.featured h3{font-size:clamp(1.5rem,2.6vw,2.1rem)}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;font-size:.76rem;letter-spacing:.06em;color:var(--faint)}
.tag{font-weight:700;letter-spacing:.16em;text-transform:uppercase;font-size:.62rem;padding:6px 10px;border-radius:999px;border:1px solid currentColor}.tag.baru{color:#ffb38f}.tag.biasa{color:var(--gold)}
.meta .ic{display:inline-flex;align-items:center;gap:6px}.meta svg{width:14px;height:14px;flex:none}
.card h3{margin:0;font-family:var(--f-display);font-weight:600;font-size:1.4rem;line-height:1.2;color:#fff8ee;text-wrap:balance}
.card p{margin:0;color:#d1daf2;font-size:.95rem}.detail{color:var(--muted);font-size:.92rem;border-top:1px dashed rgba(241,244,255,.16);padding-top:12px;white-space:pre-line}
.card .more{margin-top:auto;font-size:.7rem}
.ann-state{grid-column:1/-1;text-align:center;color:var(--muted);padding:34px 12px;display:grid;gap:12px;justify-items:center;background:rgba(8,13,40,.9);border-radius:18px}
.ann-state svg{width:42px;height:42px;color:var(--gold)}.ann-state b{font-family:var(--f-display);font-weight:600;font-size:1.3rem;color:#fff8ee}
.sk{height:140px;border-radius:18px;background:rgba(255,255,255,.06);animation:sk 1.4s ease-in-out infinite alternate}@keyframes sk{to{opacity:.4}}
.moreAll{justify-self:center;grid-column:1/-1}
.lapangan{display:block;width:100%;height:auto;margin-top:46px;margin-bottom:-2px}

footer{background:linear-gradient(#050816,#04061a);border-top:1px solid rgba(246,189,98,.14)}
footer .wrap{padding-block:48px 34px;display:grid;gap:30px}.foot-top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:22px}
.foot-quote{font-family:var(--f-display);font-style:italic;font-size:clamp(1.3rem,2.6vw,1.9rem);max-width:28ch;line-height:1.3;margin:0}
.foot-bot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;font-size:.78rem;color:var(--faint);border-top:1px solid rgba(241,244,255,.08);padding-top:20px}.foot-bot a{text-decoration:none}

.rv{opacity:0;transform:translateY(18px);transition:opacity .6s,transform .6s;transition-delay:var(--d,0s)}.rv.in{opacity:1;transform:none}

@media (max-width:860px){.links{display:none}.grid2,.ann-grid,.role-row{grid-template-columns:minmax(0,1fr)}.journey{height:210vh}}
@media (max-width:520px){.bt small{display:none}.nav .wrap{gap:12px}.hero-txt{top:max(10vh,78px)}.cue{display:none}.pillars-label{display:none}.pillars{font-size:.6rem;gap:4px 12px}.card.featured{padding:24px}.btn{padding:13px 20px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}html{scroll-behavior:auto}.rv{opacity:1;transform:none}.journey{height:auto}.stage{position:relative}}

</style>
</head>

<script>
(function(){
"use strict";
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const W=1600,H=1300;
function ridge(o){
  const r=rng(o.seed),n=128,pts=new Float32Array(n+1);let size=n,a=o.amp;
  while(size>1){const hs=size/2;for(let i=hs;i<n;i+=size)pts[i]=(pts[i-hs]+pts[i+hs])/2+(r()*2-1)*a;a*=(o.rough||.55);size=hs}

  for(let i=0;i<=n;i++){const u=i/n;let y=o.base-pts[i];(o.peaks||[]).forEach(p=>{y-=p.h*Math.exp(-Math.pow(Math.abs(u-p.x)/p.w,p.s||1.25))});ys.push(y)}
  let line='';ys.forEach((y,i)=>{line+=(i?'L':'M')+(i/n*W).toFixed(1)+' '+y.toFixed(1)+' '});
  return{fill:line+`L${W} ${H} L0 ${H}Z`,line,yAt:x=>{const f=x/W*n,i=Math.max(0,Math.min(n-1,Math.floor(f))),t=f-i;return ys[i]*(1-t)+ys[i+1]*t}};
}

const ESC=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const IKON=['<rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="11" r="2.5"/><path d="M5.5 17c.8-1.8 2-2.6 3.5-2.6s2.7.8 3.5 2.6M15 9h3M15 13h3"/>','<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4M8 15h3"/>','<path d="M4 7a2 2 0 0 1 2-2h4l2 2h6a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><path d="M9 13h6"/>','<path d="M4 20h16"/><path d="M6 16l4-4 3 3 5-6"/><path d="M15 9h3v3"/>','<path d="M12 3l8 3v5c0 5-3.4 8.5-8 10-4.6-1.5-8-5-8-10V6z"/><path d="M9 12l2 2 4-4"/>','<path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/>'];
const baris=s=>String(s||'').split('\n').map(x=>x.trim()).filter(Boolean).map(x=>{const i=x.indexOf('|');return i<1?[x,'']:[x.slice(0,i).trim(),x.slice(i+1).trim()]});
const split=s=>{s=String(s);const k=s.trim().split(/\s+/);if(k.length>1)return ESC(k.slice(0,-1).join(' '))+' <i>'+ESC(k[k.length-1])+'</i>';const n=Math.max(1,Math.ceil(s.length*.55));return ESC(s.slice(0,n))+'<i>'+ESC(s.slice(n))+'</i>'};
const hexOk=v=>/^#[0-9A-Fa-f]{6}$/.test(v||'');
const mix=(a,b,p)=>{const f=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16)),x=f(a),y=f(b);return '#'+x.map((v,i)=>Math.round(v+(y[i]-v)*p).toString(16).padStart(2,'0')).join('')};
function fitJudul(){const t=$('#heroTitle');if(!t)return;t.style.fontSize='100px';const sp=[...t.querySelectorAll(':scope>span')];const w=sp.reduce((a,s)=>a+s.getBoundingClientRect().width,0)||1;
  const maxW=Math.min(innerWidth-40,1000);t.style.fontSize=Math.max(26,Math.min(130,100*maxW/w))+'px'}
function isi(T){
  T=Object.assign({},DEF,T||{});
  document.title=T.nama+' | '+T.instansi;
  $('#bNama').textContent=T.nama;$('#bSub').textContent=T.sub;
  const lg=$('#bLogo');if(T.logo&&/^data:image\/(png|jpeg);base64,/.test(T.logo)){lg.src=T.logo;lg.hidden=false}else{lg.hidden=true;lg.removeAttribute('src')}
  if(hexOk(T.aksen)&&T.aksen.toUpperCase()!=='#D97706')document.documentElement.style.setProperty('--gold',mix(T.aksen,'#FFFFFF',.38));
  $('#hKicker').textContent=T.berKicker;
  const t=$('#heroTitle');t.setAttribute('aria-label',T.berJudul);
  t.innerHTML=(T.berSub?'<em>'+ESC(T.berSub)+'</em>':'')+[...T.berJudul].map(c=>c===' '?'<span style="width:.3em">&nbsp;</span>':'<span>'+ESC(c)+'</span>').join('');
  t.querySelectorAll(':scope>span').forEach((s,i)=>s.style.animationDelay=(.35+i*.06)+'s');
  $('#hLead').textContent=T.berLead;$('#hTombol').textContent=T.berTombol;$('#fTombol').textContent=T.berTombol;
  $('#hPilar').innerHTML=(T.berPilarLabel?'<span class="pillars-label">'+ESC(T.berPilarLabel)+'</span>':'')+String(T.berPilar).split(',').map(x=>x.trim()).filter(Boolean).map(x=>'<span>'+ESC(x)+'</span>').join('');
  $('#iKicker').textContent=T.berInfoKicker;$('#iJudul').innerHTML=split(T.berInfoJudul);$('#iLead').textContent=T.berInfoLead;$('#nInfo').textContent=T.berInfoJudul;
  $('#iFitur').innerHTML=baris(T.berFitur).map((f,i)=>`<article class="feat rv"><div class="no">${String(i+1).padStart(2,"0")}</div><div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${IKON[i%IKON.length]}</svg></div><h3>${ESC(f[0])}</h3><p>${ESC(f[1])}</p></article>`).join('');
  $('#pJudul').textContent=T.berPeranJudul;$('#pLead').textContent=T.berPeranLead;
  $('#pPeran').innerHTML=baris(T.berPeran).map(f=>`<div class="role"><b>${ESC(f[0])}</b><span>${ESC(f[1])}</span></div>`).join('');
  $('#gKicker').textContent=T.berPengKicker;$('#gJudul').innerHTML=split(T.berPengJudul);$('#gLead').textContent=T.berPengLead;$('#nPeng').textContent=T.berPengJudul;$('#hLihat').textContent='Lihat '+T.berPengJudul;
  $('#fKutip').textContent=T.berKutip;$('#fHak').textContent='© '+new Date().getFullYear()+' '+T.instansi+' · '+T.nama;
  fitJudul();rvAll();
}
isi(null);
(document.fonts&&document.fonts.ready||Promise.resolve()).then(fitJudul);

/* ============ PENGUMUMAN (hanya yang ditandai Super Admin "tampil di halaman depan") ============ */
const BLN=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const tgl=s=>{const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(String(s||''));return m?(+m[3])+' '+BLN[+m[2]-1]+' '+m[1]:''};
const grid=$('#annGrid');let DATA=null,SEMUA=false;
const ICO={cal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',pin:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-6.2 7-11a7 7 0 0 0-14 0c0 4.8 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>'};
function status(ikon,judul,teks,aksi){grid.innerHTML=`<div class="ann-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">${ikon}</svg><b>${ESC(judul)}</b><span>${ESC(teks)}</span>${aksi||''}</div>`}
function render(){
  if(DATA===null){grid.innerHTML='<div class="sk"></div><div class="sk"></div>';return}
  if(!DATA.length){status('<path d="M3 11v2a1 1 0 0 0 1 1h2l5 4V6L6 10H4a1 1 0 0 0-1 1z"/><path d="M15 9a4 4 0 0 1 0 6M18 6.5a8 8 0 0 1 0 11"/>','Belum ada pengumuman','Pengumuman terbaru dari satuan kerja akan tampil di sini.');return}
  const L=SEMUA?DATA:DATA.slice(0,6);
  grid.innerHTML=L.map((p,i)=>{const ring=String(p.Deskripsi||'').replace(/\s+/g,' ').trim(),pendek=ring.length>150?ring.slice(0,147).trimEnd()+'…':ring,ada=ring.length>150||p.Lokasi||p.Waktu;
    return `<article class="card${i===0?' featured':''}"><div class="meta"><span class="tag ${i===0?'baru':'biasa'}">${i===0?'Terbaru':'Pengumuman'}</span><time class="date" datetime="${ESC(p.Tanggal)}">${ESC(tgl(p.Tanggal))}</time>${p.Sampai&&p.Sampai!==p.Tanggal?`<span class="when">s.d. ${ESC(tgl(p.Sampai))}</span>`:''}</div>
    <h3>${ESC(p.Judul)}</h3>${pendek?`<p>${ESC(pendek)}</p>`:''}
    ${ada?`<div class="detail" id="d${i}" hidden>${p.Waktu||p.Lokasi?`<div class="meta" style="margin-bottom:8px">${p.Waktu?`<span class="ic">${ICO.cal}${ESC(p.Waktu)} WIB</span>`:''}${p.Lokasi?`<span class="ic">${ICO.pin}${ESC(p.Lokasi)}</span>`:''}</div>`:''}${ESC(p.Deskripsi||'')}</div><button class="more" type="button" aria-expanded="false" aria-controls="d${i}">Baca selengkapnya</button>`:''}</article>`}).join('')
    +(!SEMUA&&DATA.length>6?`<button class="btn btn-ghost btn-sm moreAll" type="button" id="semuaPeng">Tampilkan semua (${DATA.length})</button>`:'');
}
grid.addEventListener('click',e=>{const b=e.target.closest('.more');if(b){const d=document.getElementById(b.getAttribute('aria-controls')),open=d.hidden;d.hidden=!open;b.setAttribute('aria-expanded',open);b.textContent=open?'Tutup':'Baca selengkapnya';return}
  if(e.target.closest('#semuaPeng')){SEMUA=true;render()}if(e.target.closest('#ulangPeng'))muat()});
function muat(){
  if(DATA===null||document.getElementById('ulangPeng'))grid.innerHTML='<div class="sk"></div><div class="sk"></div>';
  if(typeof GAS_URL==='undefined'||!GAS_URL||/GANTI/.test(GAS_URL)){if(DATA===null){DATA=[];render()}return}
  const ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),30000);
  fetch(GAS_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn:'getBeranda',args:[]}),signal:ctl.signal})
   .then(r=>{if(!r.ok)throw new Error('http');return r.json()})
   .then(r=>{if(!r||!r.success)throw new Error('gagal');isi(r.data.tampilan);DATA=r.data.pengumuman||[];render();try{localStorage.setItem('beranda_cache',JSON.stringify({t:r.data.tampilan,p:DATA}))}catch(e){}})
   .catch(()=>{if(DATA===null)status('<circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16.5v.5"/>','Pengumuman belum dapat dimuat','Periksa koneksi internet lalu coba lagi.','<button class="btn btn-ghost btn-sm" type="button" id="ulangPeng">Coba lagi</button>')})
   .finally(()=>clearTimeout(tm));
}
try{const c=JSON.parse(localStorage.getItem('beranda_cache')||'null');if(c){isi(c.t);DATA=Array.isArray(c.p)?c.p:null}}catch(e){}
render();muat();rvAll();
document.addEventListener('visibilitychange',()=>{if(!document.hidden)muat()});

})();
</script>
</body>
</html>
