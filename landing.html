*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--sky1);color:#fff;font-family:"Plus Jakarta Sans","Segoe UI",system-ui,sans-serif;font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow:hidden}

.stage{position:fixed;inset:0;overflow:hidden;background:linear-gradient(180deg,var(--sky1) 0%,var(--sky2) calc(var(--hz,65%)*.62),var(--sky3) var(--hz,65%),var(--w0) var(--hz,65%))}
.stars{position:absolute;inset:0 0 38% 0;opacity:var(--stars);background-image:radial-gradient(1.4px 1.4px at 8% 14%,#fff8e8,transparent),radial-gradient(1px 1px at 22% 30%,#fff,transparent),radial-gradient(1.6px 1.6px at 36% 10%,#fff8e8,transparent),radial-gradient(1px 1px at 52% 26%,#fff,transparent),radial-gradient(1.4px 1.4px at 66% 12%,#fff8e8,transparent),radial-gradient(1px 1px at 80% 32%,#fff,transparent),radial-gradient(1px 1px at 92% 18%,#fff,transparent),radial-gradient(1.2px 1.2px at 14% 46%,#fff,transparent),radial-gradient(1px 1px at 58% 44%,#fff,transparent),radial-gradient(1.2px 1.2px at 88% 6%,#fff,transparent);animation:tw 5s ease-in-out infinite alternate}

#scene{position:absolute;inset:0;width:100%;height:100%;display:block;overflow:visible}

.c-orb{fill:var(--orb)}.c-halo{fill:var(--halo)}.c-cla{fill:var(--cla)}.c-clb{fill:var(--clb)}.c-far{fill:var(--far)}.c-rl{fill:var(--rockl)}.c-rm{fill:var(--rockm)}.c-rd{fill:var(--rockd)}.c-gr{fill:var(--grass)}.c-tw{fill:var(--tower)}.c-bd{fill:var(--band)}.c-lamp{fill:var(--lamp)}.c-win{fill:var(--win)}.c-hull{fill:var(--hull)}.c-s1{fill:var(--sail1)}.c-s2{fill:var(--sail2)}.c-cab{fill:var(--cab)}.c-foam{fill:var(--foam)}
.c-w0{fill:var(--w0)}
.crest{fill:none;stroke:var(--crest);stroke-linecap:round;stroke-linejoin:round;opacity:.75}
.orb{transform:translateY(var(--orby));opacity:var(--orbo)}.crater{opacity:var(--crater)}.ray{opacity:var(--ray)}
.beamwrap{opacity:var(--beam)}.lampglow{opacity:var(--beam)}
/* animasi */
.slide{animation:slide linear infinite}@keyframes slide{to{transform:translateX(calc(var(--wl)*-1))}}
.bobR{animation:bobR ease-in-out infinite alternate}@keyframes bobR{from{transform:translateY(calc(var(--ba)*-1))}to{transform:translateY(var(--ba))}}
.rock{transform-origin:0 0;animation:rock 7s ease-in-out infinite}
@keyframes rock{0%,100%{transform:translateY(6px) rotate(-2.6deg)}50%{transform:translateY(-12px) rotate(2.4deg)}}
.sail{transform-origin:0 0;animation:billow 5s ease-in-out infinite alternate}.sail.b{animation-duration:4.2s}
@keyframes billow{from{transform:skewY(-1.4deg) scaleX(1)}to{transform:skewY(1.6deg) scaleX(.97)}}
.beam{transform-origin:0 0;animation:spin 9s ease-in-out infinite}
@keyframes spin{0%,100%{transform:scaleX(1)}50%{transform:scaleX(-1)}}
.flag{transform-box:fill-box;transform-origin:left center;animation:flag 2.2s ease-in-out infinite}
@keyframes flag{0%,100%{transform:skewY(-5deg) scaleX(1)}50%{transform:skewY(6deg) scaleX(.88)}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 4s ease-in-out infinite}@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.drift{animation:drift 30s ease-in-out infinite alternate}.drift.b{animation-duration:42s;animation-direction:alternate-reverse}
@keyframes drift{from{transform:translateX(-60px)}to{transform:translateX(70px)}}
.gull{animation:fly 26s linear infinite;opacity:0}.gull.b{animation-duration:34s;animation-delay:-12s}.gull.c{animation-duration:40s;animation-delay:-24s}
@keyframes fly{0%{transform:translate(-120px,0);opacity:0}6%{opacity:.9}50%{transform:translate(900px,-40px)}94%{opacity:.9}100%{transform:translate(1900px,10px);opacity:0}}
.gull path{animation:flap .5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}@keyframes flap{from{transform:scaleY(1)}to{transform:scaleY(.35)}}
.spray circle{animation:spray 1.8s ease-out infinite;transform-box:fill-box}
@keyframes spray{0%{transform:translate(0,0);opacity:0}15%{opacity:.9}100%{transform:translate(var(--sx,-26px),-46px);opacity:0}}
.foamrow{animation:foam 3.4s ease-in-out infinite alternate}@keyframes foam{from{opacity:.25}to{opacity:.8}}
.legL,.legR,.armL,.armR,.salute,.bob,.palm{transform-box:fill-box}
.salute{transform-origin:20% 90%;animation:salute 3.8s ease-in-out infinite}@keyframes salute{0%,100%{transform:rotate(0)}50%{transform:rotate(-4deg)}}
.bob{transform-origin:50% 100%;animation:bob 3s ease-in-out infinite}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.6px)}}
.flick{animation:flick 3.2s steps(1) infinite}@keyframes flick{0%,100%{opacity:1}47%{opacity:.5}52%{opacity:1}}
.paused *{animation-play-state:paused!important}
.lite .stars,.lite .drift,.lite .gull,.lite .spray,.lite .pulse,.lite .salute,.lite .bob,.lite .foamrow,.lite .flick{animation:none}.lite .gull,.lite .spray{display:none}

.btn-line{background:var(--pcard);border-color:var(--pline);color:var(--ptx)}
/* notifikasi */
.notif{position:fixed;z-index:25;top:max(70px,calc(env(safe-area-inset-top,0px) + 64px));right:max(16px,env(safe-area-inset-right,0px));width:min(380px,calc(100% - 32px));background:var(--pbg);color:var(--ptx);border-radius:16px;border:1px solid var(--pline);box-shadow:0 18px 50px rgba(5,8,50,.45);padding:14px 14px 14px 16px;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;transform:translateY(-24px) scale(.96);opacity:0;visibility:hidden;transition:transform .5s cubic-bezier(.2,.9,.3,1.2),opacity .35s,visibility .5s}
.notif.on{transform:none;opacity:1;visibility:visible}
.notif .bi{width:40px;height:40px;border-radius:12px;background:#f6bd62;color:#1b1233;display:grid;place-items:center}.notif .bi svg{width:20px;height:20px;animation:ring 1.6s ease-in-out 3}
.notif b{display:block;font-size:.94rem;line-height:1.25}.notif small{display:block;color:var(--pmut);font-size:.84rem;margin-top:2px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.notif .acts{display:flex;gap:14px;margin-top:8px}.notif .acts button{background:none;border:0;padding:4px 0;cursor:pointer;font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;font-weight:800;color:#d98a1c}:root[data-t=night] .notif .acts button,:root[data-t=dusk] .notif .acts button{color:#f6bd62}
.notif .nx{width:32px;height:32px;border:0;background:none;cursor:pointer;color:var(--pmut);display:grid;place-items:center}.nx svg{width:16px;height:16px}
@media (max-width:760px){.hero{transition:transform .5s cubic-bezier(.2,.8,.2,1)}.nf .hero{transform:translateY(104px)}.nl{display:none}.pills{display:flex}.nav .grp.l{gap:0}.brand b{font-size:.78rem;letter-spacing:.1em}.hero{top:max(10vh,72px)}.btn-go{padding:14px 22px}.sheet{width:100%;top:8vh;border-radius:22px 22px 0 0;transform:translateY(104%);box-shadow:0 -20px 60px rgba(0,0,0,.4)}.sheet.on{transform:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition-duration:.01s!important}}

.info-isi{font-size:.9rem;color:var(--pmut)}.info-isi h4{margin:14px 0 4px;font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:#d98a1c}:root[data-t=night] .info-isi h4,:root[data-t=dusk] .info-isi h4{color:#f6bd62}.info-isi p{margin:0 0 6px}.info-isi ul{margin:0 0 8px;padding-left:18px}.info-isi li{margin-bottom:3px}[hidden]{display:none!important}

<script>
(function(){
"use strict";
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const W=1600,H=1300;
function ridge(o){
  const r=rng(o.seed),n=128,pts=new Float32Array(n+1);let size=n,a=o.amp;
  while(size>1){const hs=size/2;for(let i=hs;i<n;i+=size)pts[i]=(pts[i-hs]+pts[i+hs])/2+(r()*2-1)*a;a*=(o.rough||.55);size=hs}
  const ys=[];
  for(let i=0;i<=n;i++){const u=i/n;let y=o.base-pts[i];(o.peaks||[]).forEach(p=>{y-=p.h*Math.exp(-Math.pow(Math.abs(u-p.x)/p.w,p.s||1.25))});ys.push(y)}
  let line='';ys.forEach((y,i)=>{line+=(i?'L':'M')+(i/n*W).toFixed(1)+' '+y.toFixed(1)+' '});
  return{fill:line+`L${W} ${H} L0 ${H}Z`,line,yAt:x=>{const f=x/W*n,i=Math.max(0,Math.min(n-1,Math.floor(f))),t=f-i;return ys[i]*(1-t)+ys[i+1]*t}};
}
const $=s=>document.querySelector(s);
function put(id,html){const el=document.getElementById(id);el.setAttribute('preserveAspectRatio','xMinYMin meet');el.setAttribute('viewBox','0 0 1600 1300');el.innerHTML=html}
const lg=(id,stops,x1=0,y1=0,x2=0,y2=1,user)=>`<linearGradient id="${id}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"${user?' gradientUnits="userSpaceOnUse"':''}>${stops.map(s=>`<stop offset="${s[0]}" stop-color="${s[1]}"${s[2]!=null?` stop-opacity="${s[2]}"`:''}/>`).join('')}</linearGradient>`;
const rg=(id,stops,cx=.5,cy=.5,r=.5)=>`<radialGradient id="${id}" cx="${cx}" cy="${cy}" r="${r}">${stops.map(s=>`<stop offset="${s[0]}" stop-color="${s[1]}" stop-opacity="${s[2]!=null?s[2]:1}"/>`).join('')}</radialGradient>`;
function cloud(x,y,s,fill,cls){
  const r=rng(Math.round(x*7+y));let c='';
  for(let i=0;i<7;i++){const cx=x+(i-3)*34*s+(r()-.5)*20*s,cy=y-(Math.sin(i/6*Math.PI))*36*s+(r()-.5)*10*s,rad=(26+r()*30)*s*(1-Math.abs(i-3)/7);c+=`<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${rad.toFixed(1)}"/>`}
  c+=`<rect x="${x-120*s}" y="${y-6*s}" width="${240*s}" height="${22*s}" rx="${11*s}"/>`;
  return `<g class="${cls||''}" fill="${fill}">${c}</g>`;
}
function leaf(x,y,len,wid,ang,fill,rim){
  const d=`M0 0 C${wid} ${-len*.3} ${wid*.7} ${-len*.8} 0 ${-len} C${-wid*.7} ${-len*.8} ${-wid} ${-len*.3} 0 0Z`;
  return `<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${ang.toFixed(1)})"><path d="${d}" fill="${fill}"/>${rim?`<path d="M0 0 C${wid*.2} ${-len*.4} ${wid*.1} ${-len*.8} 0 ${-len}" stroke="${rim}" stroke-width="1.4" fill="none" opacity=".55"/>`:''}</g>`;
}

/* ===== GAMBAR: tanpa logo, nama, atau tulisan. Semua vektor ringan. ===== */
function petugas(x,y,h,o={}){
  const s=h/100,d=o.dir||1,sh=o.shirt||'#2f4aa8',pt=o.pants||'#1a2352',sk=o.skin||'#d99a72',cp=o.cap||'#1a2352',rim=o.rim||'#ffb878',bd=o.band||'#e9a73c';
  const lg2=o.walk?['legL','legR']:['',''];
  const arm=o.salute?`<g class="salute"><path d="M13 -81 L23 -73 L8.5 -95.5" fill="none" stroke="${sh}" stroke-width="5.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="7.6" cy="-96" r="2.6" fill="${sk}"/></g>`:`<g class="${o.walk?'armR':''}"><path d="M13 -82 L17 -52 L12.4 -51 L9 -78Z" fill="${sh}"/><circle cx="14.8" cy="-50" r="2.6" fill="${sk}"/></g>`;
  const g=`<ellipse cx="0" cy="1" rx="15" ry="3" fill="#000" opacity=".28"/>
    <g class="${lg2[0]}"><rect x="-8.6" y="-46" width="8" height="43" rx="2.5" fill="${pt}"/><path d="M-10.4 -3 h11.2 v4 h-11.2z" fill="#0a0d29"/></g>
    <g class="${lg2[1]}"><rect x="0.6" y="-46" width="8" height="43" rx="2.5" fill="${pt}"/><path d="M-0.8 -3 h11.2 v4 h-11.2z" fill="#0a0d29"/></g>
    <g class="${o.walk?'armL':''}"><path d="M-13 -82 L-17 -52 L-12.4 -51 L-9 -78Z" fill="${sh}"/><circle cx="-14.8" cy="-50" r="2.6" fill="${sk}"/></g>
    <path d="M-13.5 -82 Q0 -87.5 13.5 -82 L12.4 -45 Q0 -42 -12.4 -45Z" fill="${sh}"/>
    <rect x="-12.4" y="-50.4" width="24.8" height="3.6" fill="#c79c46"/><rect x="-2.2" y="-50.8" width="4.4" height="4.4" rx=".8" fill="${bd}"/>
    <rect x="-13.6" y="-83.6" width="7.4" height="2.8" rx="1" fill="${bd}"/><rect x="6.2" y="-83.6" width="7.4" height="2.8" rx="1" fill="${bd}"/>
    <rect x="3.4" y="-74" width="6.2" height="5" rx="1" fill="#fff" opacity=".13"/><circle cx="-6" cy="-72" r="1.7" fill="${bd}"/><path d="M-4.4 -85.4 L0 -77 L4.4 -85.4Z" fill="#e9e5d9"/>
    ${arm}
    <rect x="-3" y="-89" width="6" height="6" fill="${sk}"/><ellipse cx="0" cy="-94.5" rx="7.3" ry="8.1" fill="${sk}"/>
    <circle cx="-2.7" cy="-94.2" r=".95" fill="#2a1a14"/><circle cx="2.7" cy="-94.2" r=".95" fill="#2a1a14"/><path d="M-2 -90.4 Q0 -89.2 2 -90.4" stroke="#8a4b3a" stroke-width=".8" fill="none" stroke-linecap="round"/>
    <path d="M-8.6 -97 Q0 -109.5 8.6 -97 L8.8 -94.4 L-8.8 -94.4Z" fill="${cp}"/><rect x="-8.8" y="-96.2" width="17.6" height="2.1" fill="${bd}"/><path d="M-8.2 -94.4 Q0 -92.4 8.2 -94.4 L9.4 -92.8 Q0 -90.4 -9.4 -92.8Z" fill="${cp}"/>
    <path d="M${d*13.5} -82 L${d*12.4} -46" stroke="${rim}" stroke-width="1.3" opacity=".8" fill="none"/>`;
  return `<g transform="translate(${x} ${y}) scale(${s})"><g class="${o.cls||''}" style="${o.sty||''}">${g}</g></g>`;
}
function palm(x,y,h,lean,fill,seed,rim){
  const r=rng(seed),tx=x+lean,ty=y-h;let f='';
  for(let i=0;i<9;i++){const a=-168+i*40+(r()-.5)*12,L=h*.36*(.8+r()*.45);f+=`<path d="M0 0 Q${(L*.5).toFixed(1)} ${(-L*.38).toFixed(1)} ${L.toFixed(1)} ${(L*.14).toFixed(1)} Q${(L*.5).toFixed(1)} ${(-L*.12).toFixed(1)} 0 0Z" fill="${fill}" transform="rotate(${a.toFixed(1)})"/>`}
  return `<path d="M${x-6} ${y} Q${x+lean*.15} ${y-h*.5} ${tx-2.5} ${ty} L${tx+3.5} ${ty} Q${x+lean*.45+7} ${y-h*.5} ${x+7} ${y}Z" fill="${fill}"/><g transform="translate(${tx.toFixed(1)} ${ty.toFixed(1)})"><g class="palm" style="animation-delay:-${(r()*4).toFixed(1)}s">${f}<circle r="5.5" cx="3" cy="7" fill="${fill}"/></g></g>`;
}

/* ===== ADEGAN PELAYARAN: kapal, ombak berlapis, tebing + mercusuar (menara pengawas) ===== */
function gelombang(i,y0,amp,wl,dur,ba,bd,id){
  const x0=-wl*2,n=Math.ceil((1600+wl*5)/wl),f=v=>v.toFixed(1);let d=`M${f(x0)} ${f(y0+amp*.3)}`;
  for(let k=0;k<n;k++){const x=x0+k*wl;d+=` C${f(x+wl*.3)} ${f(y0+amp*.5)} ${f(x+wl*.46)} ${f(y0-amp*.95)} ${f(x+wl*.62)} ${f(y0-amp)} C${f(x+wl*.76)} ${f(y0-amp*.8)} ${f(x+wl*.9)} ${f(y0+amp*.2)} ${f(x+wl)} ${f(y0+amp*.3)}`}
  const xe=x0+n*wl;
  const band=`<path d="${d}" transform="translate(0 ${f(amp*.9+2)})" fill="none" stroke="var(--crest)" stroke-opacity=".18" stroke-width="${f(amp*.8+3)}"/>`;
  const sp=i>=3?`<path d="${d}" fill="none" stroke="var(--foam)" stroke-width="${f(2+i)}" stroke-linecap="round" stroke-dasharray="2 ${f(wl*.18)}" opacity=".7"/>`:'';
  return `<g class="bobR" style="--ba:${ba}px;animation-duration:${bd}s;animation-delay:-${(i*1.3).toFixed(1)}s"><g class="slide" style="--wl:${wl}px;animation-duration:${dur}s"><path d="${d} L${f(xe)} 1700 L${f(x0)} 1700Z" fill="url(#wg${i})"/>${band}<path class="crest" d="${d}" stroke-width="${(1.2+i*.7).toFixed(1)}"/>${sp}</g></g>`;
}
const ROWS=[[652,3,110,40,2,5],[676,5,150,34,3,5.5],[712,9,220,28,4,6],[760,15,320,22,6,6.5],[836,24,470,17,9,7],[930,34,660,13,13,7.5]];
function kapal(lite){
  const lines='M-22 -520 L-262 -64 M-22 -520 L328 -128 M-22 -520 L-22 -70';
  const net='';
  return `<g class="rock">
   <path d="M-262 -64 L330 -128 L318 -100 Q250 -4 120 8 L-210 8 Q-250 4 -262 -64Z" class="c-hull"/>
   <path d="M-262 -64 L330 -128 L326 -114 L-259 -52Z" fill="#f6bd62"/><path d="M-258 -40 L300 -90" stroke="#fff" stroke-opacity=".25" stroke-width="3" fill="none"/>
   <rect x="-122" y="-118" width="168" height="56" rx="10" class="c-cab"/><rect x="-104" y="-104" width="30" height="20" rx="4" fill="#243a9c" opacity=".7"/><rect x="-62" y="-104" width="30" height="20" rx="4" fill="#243a9c" opacity=".7"/><rect x="-20" y="-104" width="30" height="20" rx="4" fill="#243a9c" opacity=".7"/>
   <rect x="-26" y="-530" width="8" height="470" fill="#6b3b2a"/><rect x="-24" y="-530" width="2" height="470" fill="#fff" opacity=".25"/>
   <g class="sail"><path d="M-30 -490 L-30 -122 Q-150 -98 -262 -130 Q-130 -290 -30 -490Z" class="c-s1"/><path d="M-30 -330 L-30 -290 L-180 -238 Q-150 -270 -30 -330Z" fill="#f6bd62" opacity=".9"/><path d="M-30 -230 L-30 -200 L-218 -170 L-232 -184Z" fill="#2b3fa6" opacity=".8"/></g>
   <g class="sail b"><path d="M-14 -500 Q70 -300 316 -138 L-14 -132Z" class="c-s2"/><path d="M-14 -300 Q60 -230 150 -178 L-14 -178Z" fill="#fff" opacity=".28"/><path d="M-14 -190 Q120 -170 230 -150 L-14 -146Z" fill="#2b3fa6" opacity=".55"/></g>
   <path d="${lines}" stroke="#2a1a1a" stroke-opacity=".6" stroke-width="1.4" fill="none"/>${net}
   <g class="flag"><rect x="-18" y="-536" width="58" height="15" fill="#e0453d"/><rect x="-18" y="-521" width="58" height="15" fill="#f6f1ea"/></g>
   <circle cx="-196" cy="-34" r="15" fill="#fff"/><circle cx="-196" cy="-34" r="15" fill="none" stroke="#e0453d" stroke-width="6" stroke-dasharray="11 12"/><circle cx="-196" cy="-34" r="6" class="c-hull"/>
   ${petugas(250,-100,104,{dir:1,salute:true,cls:'bob'})}${petugas(-196,-62,92,{dir:1,cls:'bob',sty:'animation-delay:-1.1s'})}
   <g class="spray">${[0,1,2,3,4,5].map(k=>`<circle cx="${300+k*6}" cy="${-84+k*3}" r="${2+k%3}" fill="#fff" style="--sx:${-20-k*8}px;animation-delay:-${(k*.3).toFixed(1)}s"/>`).join('')}</g>
  </g>`;
}
function tebing(){
  const lh=`<g transform="translate(1385 512) scale(.78)">
   <path d="M-34 0 L34 0 L24 -230 L-24 -230Z" class="c-tw"/><path d="M-31 -40 L31 -40 L29 -78 L-29 -78Z" class="c-bd"/><path d="M-28 -118 L28 -118 L26 -156 L-26 -156Z" class="c-bd"/><path d="M-25 -196 L25 -196 L24 -230 L-24 -230Z" class="c-bd"/>
   <path d="M10 0 L34 0 L24 -230 L16 -230Z" fill="#000" opacity=".12"/>
   <rect x="-40" y="-246" width="80" height="10" rx="3" class="c-tw"/><rect x="-20" y="-288" width="40" height="44" rx="4" class="c-lamp"/><path d="M-28 -288 L0 -326 L28 -288Z" class="c-bd"/><rect x="-2" y="-340" width="4" height="16" class="c-tw"/>
   <g transform="translate(0 -266)"><circle r="150" fill="url(#lampg)" class="lampglow pulse"/><g class="beamwrap"><g class="beam"><path d="M0 0 L1100 -90 L1100 90Z" fill="url(#beamg)"/></g></g></g>

grid.addEventListener('click',e=>{const b=e.target.closest('.mr');if(b){const d=document.getElementById(b.getAttribute('aria-controls')),open=d.hidden;d.hidden=!open;b.setAttribute('aria-expanded',open);b.textContent=open?'Tutup':'Baca selengkapnya';return}
  if(e.target.closest('#semuaPeng')){SEMUA=true;render()}if(e.target.closest('#ulangPeng'))muat()});
/* ===== NOTIFIKASI: muncul otomatis bila ada pengumuman yang belum dibaca ===== */
const notif=$('#notif'),bBadge=$('#bBadge'),bBell=$('#bBell');let dibaca=[],tampilId=new Set(),nt=0;
try{dibaca=JSON.parse(localStorage.getItem('ann_dibaca')||'[]')}catch(e){}
const idP=p=>String(p.ID||p.Judul+'|'+p.Tanggal);
const belum=()=>(DATA||[]).filter(p=>!dibaca.includes(idP(p)));
function simpanDibaca(){try{localStorage.setItem('ann_dibaca',JSON.stringify(dibaca.slice(-80)))}catch(e){}}
function tandaiDibaca(){(DATA||[]).forEach(p=>{if(!dibaca.includes(idP(p)))dibaca.push(idP(p))});simpanDibaca();lencana()}
function lencana(){const n=belum().length;bBadge.hidden=!n;bBadge.textContent=n>9?'9+':n}
function hideNotif(){notif.classList.remove('on');root.classList.remove('nf');clearTimeout(nt)}
function showNotif(){const b=belum();if(!b.length||aktif)return;const baru=b.filter(p=>!tampilId.has(idP(p)));if(!baru.length)return;b.forEach(p=>tampilId.add(idP(p)));
  $('#nJudul').textContent=b.length+' '+TT.berPengJudul+' baru';$('#nIsi').textContent=b[0].Judul;
  notif.classList.add('on');root.classList.add('nf');bBell.classList.remove('ring');void bBell.offsetWidth;bBell.classList.add('ring');nt=setTimeout(hideNotif,20000)}
$('#nLihat').addEventListener('click',()=>buka('peng'));$('#nNanti').addEventListener('click',hideNotif);$('#nTutup').addEventListener('click',hideNotif);
function sesudahMuat(){lencana();render();setTimeout(showNotif,1400)}
function muat(){
  if(DATA===null||document.getElementById('ulangPeng'))grid.innerHTML='<div class="sk"></div><div class="sk"></div>';
  if(typeof GAS_URL==='undefined'||!GAS_URL||/GANTI/.test(GAS_URL)){if(DATA===null){DATA=[];render()}return}
  const ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),30000);
  fetch(GAS_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn:'getBeranda',args:[]}),signal:ctl.signal})
   .then(r=>{if(!r.ok)throw new Error('http');return r.json()})
   .then(r=>{if(!r||!r.success)throw new Error('gagal');isi(r.data.tampilan);DATA=r.data.pengumuman||[];sesudahMuat();try{localStorage.setItem('beranda_cache',JSON.stringify({t:r.data.tampilan,p:DATA}))}catch(e){}})
   .catch(()=>{if(DATA===null)status('<circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16.5v.5"/>','Pengumuman belum dapat dimuat','Periksa koneksi internet lalu coba lagi.','<button class="btn btn-line btn-sm" type="button" id="ulangPeng">Coba lagi</button>')})
   .finally(()=>clearTimeout(tm));
}
try{const c=JSON.parse(localStorage.getItem('beranda_cache')||'null');if(c){isi(c.t);DATA=Array.isArray(c.p)?c.p:null;lencana()}}catch(e){}
render();muat();
document.addEventListener('visibilitychange',()=>{if(!document.hidden)muat()});
setInterval(()=>{if(!document.hidden)muat()},300000);

})();
</script>
</body>
</html>
